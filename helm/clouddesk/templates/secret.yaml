{{- /*
Generated secrets are reused from the existing Secret on upgrade (via lookup).
Regenerating them would make stored credentials undecryptable and log
everyone out. Values set in values.yaml always take precedence.
*/ -}}
{{- $secretName := printf "%s-secret" (include "clouddesk.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName | default dict }}
{{- $existing := get $existingSecret "data" | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "clouddesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database connection
  {{- if .Values.mongodb.enabled }}
  MONGODB_URI: {{ include "clouddesk.mongodbUri" . | quote }}
  {{- else }}
  MONGODB_URI: {{ printf "mongodb://%s:%s@%s:%d/%s?authSource=admin" .Values.mongodb.external.username .Values.mongodb.external.password .Values.mongodb.external.host (int .Values.mongodb.external.port) .Values.mongodb.external.database | quote }}
  {{- end }}

  # Redis connection
  REDIS_URL: {{ include "clouddesk.redisUrl" . | quote }}

  # JWT secrets
  {{- if .Values.security.jwtAccessSecret }}
  JWT_ACCESS_SECRET: {{ .Values.security.jwtAccessSecret | quote }}
  {{- else if hasKey $existing "JWT_ACCESS_SECRET" }}
  JWT_ACCESS_SECRET: {{ index $existing "JWT_ACCESS_SECRET" | b64dec | quote }}
  {{- else }}
  JWT_ACCESS_SECRET: {{ randAlphaNum 64 | quote }}
  {{- end }}
  {{- if .Values.security.jwtRefreshSecret }}
  JWT_REFRESH_SECRET: {{ .Values.security.jwtRefreshSecret | quote }}
  {{- else if hasKey $existing "JWT_REFRESH_SECRET" }}
  JWT_REFRESH_SECRET: {{ index $existing "JWT_REFRESH_SECRET" | b64dec | quote }}
  {{- else }}
  JWT_REFRESH_SECRET: {{ randAlphaNum 64 | quote }}
  {{- end }}

  # Encryption key for credentials (backend requires exactly 64 hex chars)
  {{- $existingKey := "" }}
  {{- if hasKey $existing "ENCRYPTION_KEY" }}
  {{- $existingKey = index $existing "ENCRYPTION_KEY" | b64dec }}
  {{- end }}
  {{- if .Values.security.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.security.encryptionKey | quote }}
  {{- else if regexMatch "^[a-fA-F0-9]{64}$" $existingKey }}
  ENCRYPTION_KEY: {{ $existingKey | quote }}
  {{- else }}
  ENCRYPTION_KEY: {{ randAlphaNum 64 | sha256sum | quote }}
  {{- end }}

  # License key
  {{- if .Values.license.key }}
  LICENSE_KEY: {{ .Values.license.key | quote }}
  {{- end }}
