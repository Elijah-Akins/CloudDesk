<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VNC Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #000; }
        #screen { width: 100%; height: 100%; }
        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: system-ui, sans-serif;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div id="screen"></div>
    <div id="status">
        <div class="spinner"></div>
        <div>Connecting to remote desktop...</div>
    </div>

    <script type="module">
        import RFB from '/novnc/core/rfb.js';

        // The parent page (same origin) sends the WebSocket URL via postMessage so the
        // access token never appears in this frame's URL, history or logs.
        const params = new URLSearchParams(window.location.search);
        const viewOnly = params.get('viewOnly') === '1';
        const resizeSession = params.get('resize') === '1';
        const statusEl = document.getElementById('status');
        const origin = window.location.origin;
        let rfb = null;

        function notifyParent(message) {
            if (window.parent !== window) {
                window.parent.postMessage(message, origin);
            }
        }

        function showStatus(text, isError) {
            const line = document.createElement('div');
            if (isError) line.className = 'error';
            line.textContent = text;
            statusEl.replaceChildren(line);
            statusEl.style.display = 'block';
        }

        function connect(url) {
            // One connection per page load; the parent reloads the frame to reconnect
            if (rfb) return;

            try {
                rfb = new RFB(document.getElementById('screen'), url, {
                    credentials: { password: '' },
                    shared: true,
                });

                rfb.viewOnly = viewOnly;
                rfb.scaleViewport = true;
                // Only the session owner resizes the remote desktop; everyone else scales
                rfb.resizeSession = resizeSession && !viewOnly;
                rfb.showDotCursor = true;

                rfb.addEventListener('connect', () => {
                    statusEl.style.display = 'none';
                    notifyParent({ type: 'vnc-connected' });
                });

                rfb.addEventListener('disconnect', (e) => {
                    showStatus(e.detail.clean ? 'Disconnected' : 'Connection lost', !e.detail.clean);
                    notifyParent({ type: 'vnc-disconnected', clean: e.detail.clean });
                });

                rfb.addEventListener('securityfailure', (e) => {
                    const message = 'Security error: ' + (e.detail.reason || 'authentication failed');
                    showStatus(message, true);
                    notifyParent({ type: 'vnc-error', error: message });
                });

                rfb.addEventListener('clipboard', (e) => {
                    notifyParent({ type: 'vnc-clipboard', text: e.detail.text });
                });

                // Exposed for the parent window's toolbar actions
                window.vncRFB = rfb;
            } catch (err) {
                const message = 'Failed to connect: ' + (err && err.message ? err.message : 'unknown error');
                showStatus(message, true);
                notifyParent({ type: 'vnc-error', error: message });
            }
        }

        window.addEventListener('message', (event) => {
            if (event.origin !== origin || event.source !== window.parent) return;
            const data = event.data;
            if (data && data.type === 'vnc-connect' && typeof data.url === 'string') {
                connect(data.url);
            }
        });
    </script>
</body>
</html>
